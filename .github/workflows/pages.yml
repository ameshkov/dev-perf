name: Pages

# Builds the interactive browser viewer (`viewer/`) and publishes it to
# GitHub Pages, so anyone can open a JSON report written by
# `dev-perf report` at https://ameshkov.github.io/dev-perf/ without
# running `compile` or standing up a local server. Deploys on every
# push to the default branch (always up to date) and on every version
# tag, and only from builds that pass the viewer's own quality gates —
# a broken viewer can never reach the live page.
#
# The workflow needs GitHub Pages enabled for the repository (Settings
# → Pages → source: "GitHub Actions"); nothing else is required.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write # to deploy the viewer to GitHub Pages
  id-token: write # to verify the deployment originates from this workflow

# Only one Pages deployment in flight at a time; a newer push
# supersedes the previous one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy the viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install viewer dependencies
        working-directory: viewer
        run: pnpm install --frozen-lockfile

      - name: Run viewer quality gates (format, lint, typecheck, test, build)
        working-directory: viewer
        run: pnpm check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

config:
  ul-indent:
    indent: 4
  ul-style:
    style: dash
  emphasis-style:
    style: asterisk
  no-duplicate-heading:
    siblings_only: true
  no-inline-html:
    allowed_elements:
      - a
      - p
      - details
      - summary
      - img
  no-trailing-spaces:
    br_spaces: 0
  line-length: false
  no-bare-urls: false
  link-fragments: false

# Skip gitignored files (clone cache `.dev-perf/`, compiled reports
# under `output/`) in addition to the explicit ignores below.
gitignore: true

ignores:
  - node_modules/**
  - build/**
